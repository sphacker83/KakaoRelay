[package]
name = "kakaorelay-app"
description = "KakaoRelay 데스크톱 앱 (Tauri 2). 원본: src/KakaoRelay.App, src/KakaoRelay.Portable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "KakaoRelay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
kakaorelay-ai.workspace = true
kakaorelay-core.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
# 개발 서버 없이 정적 UI를 실행 파일에 넣기 위해 custom-protocol을 항상 켠다.
tauri = { version = "2.11", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-dialog = "2.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
kakaorelay-macos.workspace = true
libc = "0.2"

[target.'cfg(windows)'.dependencies]
kakaorelay-windows.workspace = true

[lints]
workspace = true
