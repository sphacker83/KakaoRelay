[package]
name = "kakaorelay-macos"
description = "KakaoRelay macos 어댑터: 카카오톡 로컬 DB 읽기, 열린 방 목록, 텍스트·이미지 발송"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kakaorelay-ai.workspace = true
kakaorelay-core.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
pbkdf2 = "0.12"
plist = "1"
# macOS에서는 CommonCrypto로 빌드된다(libsqlite3-sys build.rs의 SQLCIPHER_CRYPTO_CC).
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }

[lints]
workspace = true
